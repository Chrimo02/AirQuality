version: "3.9"
services:
  api:
    build:
      context: .
      dockerfile: DOCKERFILE_backend
    container_name: airquality-api
    ports:
      - "8000:8000"
    volumes:
      - ./database:/app/database      # SQLite-DB bleibt erhalten!
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: DOCKERFILE_frontend
    container_name: airquality-frontend
    ports:
      - "3000:80"
    restart: unless-stopped
    depends_on:
      - api
