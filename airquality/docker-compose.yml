version: "3.9"
services:
  api:
    build:
      context: .
      dockerfile: DOCKERFILE.backend
    container_name: airquality-api
    ports:
      - "8000:8000"
    volumes:
      - ./database:/app/database      # SQLite-DB bleibt erhalten!
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_USE_MOCK: ${VITE_USE_MOCK:-false}
        VITE_API_URL:   ${VITE_API_URL:-http://localhost:8000}
    ports:
      - '8080:80'
    # optional, falls du Umgebungsvariablen auch zur Laufzeit brauchst
    environment:
      - VITE_USE_MOCK=${VITE_USE_MOCK:-false}
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
