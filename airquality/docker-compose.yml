version: "3.9"
services:
  api:
    build:
      context: .
      dockerfile: DOCKERFILE.backend
    container_name: airquality-api
    ports:
      - "8000:8000"
    volumes:
      - ./database:/app/database      # SQLite-DB bleibt erhalten!
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    devices:
      - "dev/ttyUSB0:/dev/ttyUSB0"

  frontend:
    build:
      context: ../frontend
      dockerfile: DOCKERFILE.frontend
      args:
        VITE_USE_MOCK: ${VITE_USE_MOCK:-false}
        VITE_API_URL:   ${VITE_API_URL:-http://172.20.10.4:8000}
    container_name: airquality-frontend

    ports:
      - '3000:80'
    restart: unless-stopped
    depends_on: 
      - api

    # optional, falls du Umgebungsvariablen auch zur Laufzeit brauchst
    environment:
      - VITE_USE_MOCK=${VITE_USE_MOCK:-false}
      - VITE_API_URL=${VITE_API_URL:-http://172.20.10.4:8000}
